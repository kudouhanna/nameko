
<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>なめこ図鑑</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Yu Gothic", "Meiryo", sans-serif;
            color: #30291f;
            background:
                    radial-gradient(ellipse at top, #51445d 0, #29243a 65%);
            min-height: 100vh;
        }

        /* 上部メニュー */
        .top-menu {
            background: #211c30;
            border-bottom: 4px solid #b69a63;
            padding: 14px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .logo {
            color: #ffe5a5;
            font-size: 27px;
            font-weight: bold;
            text-decoration: none;
            white-space: nowrap;
        }

        .menu-links {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .menu-links a {
            color: #fff0c7;
            text-decoration: none;
            border: 1px solid #a68a54;
            border-radius: 8px;
            padding: 10px 16px;
            background: #40344a;
            font-size: 14px;
        }

        .menu-links a:hover {
            background: #68543e;
        }

        /* メイン */
        .container {
            max-width: 1250px;
            margin: 35px auto;
            padding: 0 25px 50px;
        }

        .page-heading {
            color: #ffe5a5;
            text-align: center;
            margin-bottom: 28px;
        }

        .page-heading h1 {
            margin: 0;
            font-size: 34px;
            letter-spacing: 4px;
        }

        .page-heading p {
            color: #d2c4a8;
            margin-top: 10px;
        }

        /* 図鑑の外枠 */
        .book-panel {
            background: #f9e2ad;
            border: 5px solid #fff8e6;
            outline: 2px solid #6b4b2c;
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.3);
        }

        .panel-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            border-bottom: 2px solid #c5a76b;
            padding-bottom: 18px;
            margin-bottom: 20px;
        }

        .panel-heading h2 {
            margin: 0;
            font-size: 23px;
            color: #4f3825;
        }

        .count {
            background: #dfc58f;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
        }

        /* 検索 */
        .search-box {
            margin-bottom: 22px;
        }

        .search-box input {
            width: 100%;
            max-width: 400px;
            padding: 12px 16px;
            border: 1px solid #c7b17e;
            border-radius: 10px;
            background: #fffaf0;
            font-size: 15px;
            outline-color: #8a9b61;
        }

        /* 図鑑カード */
        .nameko-list {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
        }

        .card {
            min-width: 0;
            background: #fff0c9;
            border: 3px solid #fffdf3;
            outline: 1px solid #8a6840;
            border-radius: 17px;
            padding: 13px;
            box-shadow: 0 3px 8px rgba(88, 61, 32, 0.2);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 15px rgba(88, 61, 32, 0.25);
        }

        .card-number {
            font-size: 14px;
            font-weight: bold;
            border-bottom: 1px solid #c9ad76;
            padding-bottom: 8px;
            margin-bottom: 10px;
        }

        /* 画像と情報を横並びに */
        .card-main {
            display: grid;
            grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
            gap: 10px;
            align-items: stretch;
        }

        .image-area {
            min-width: 0;
            min-height: 155px;
            background: #74b6b5;
            border: 3px solid #d6c18c;
            border-radius: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .nameko-image {
            width: 100%;
            height: 155px;
            padding: 8px;
            object-fit: contain;
        }

        .no-image {
            color: #f9ffff;
            font-size: 13px;
            text-align: center;
        }

        .info-area {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .info-box {
            background: #e6cc96;
            border-radius: 10px;
            padding: 9px 8px;
            min-width: 0;
        }

        .info-label {
            display: block;
            font-size: 12px;
            color: #65513b;
            margin-bottom: 5px;
        }

        .info-value {
            display: block;
            font-size: 17px;
            font-weight: bold;
            text-align: right;
            overflow-wrap: anywhere;
        }

        .rarity {
            color: #a16d00;
            letter-spacing: 1px;
        }

        /* 名前の帯 */
        .name-area {
            margin-top: 12px;
            background: #e6cc96;
            border-radius: 10px;
            padding: 11px 13px;
            font-weight: bold;
            font-size: 17px;
        }

        .description {
            min-height: 75px;
            margin: 10px 0;
            padding: 12px;
            border-radius: 10px;
            background: #f0d9a5;
            color: #5c4a34;
            font-size: 13px;
            line-height: 1.7;
            overflow-wrap: anywhere;
        }

        .button {
            display: block;
            text-align: center;
            padding: 10px;
            background: linear-gradient(#e8bd72, #c68d43);
            color: #392717;
            text-decoration: none;
            font-weight: bold;
            border: 2px solid #fff3d2;
            outline: 1px solid #a4753e;
            border-radius: 10px;
        }

        .button:hover {
            background: #f3d294;
        }

        .empty-message {
            text-align: center;
            padding: 45px 15px;
            color: #6b573a;
            background: #fff0c9;
            border-radius: 15px;
        }

        .no-results {
            display: none;
            text-align: center;
            color: #6b573a;
            padding: 20px;
        }

        /* 画面が狭い場合 */
        @media (max-width: 900px) {
            .nameko-list {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .top-menu {
                align-items: flex-start;
                flex-direction: column;
            }
        }

        @media (max-width: 560px) {
            .container {
                padding: 0 12px 30px;
                margin-top: 20px;
            }

            .book-panel {
                padding: 14px;
            }

            .nameko-list {
                grid-template-columns: 1fr;
            }

            .page-heading h1 {
                font-size: 26px;
            }

            .menu-links a {
                padding: 8px 10px;
            }
        }
    </style>
</head>

<body>

<header class="top-menu">
    <a th:href="@{/namekos}" class="logo">🍄 なめこ図鑑</a>

    <nav class="menu-links">
        <a th:href="@{/namekos}">図鑑</a>
        <a th:href="@{/namekos/new}">＋ なめこ登録</a>
    </nav>
</header>

<main class="container">

    <div class="page-heading">
        <h1>なめこ図鑑</h1>
        <p>個性豊かななめこたちを集めよう！</p>
    </div>

    <section class="book-panel">

        <div class="panel-heading">
            <h2>📖 なめこコレクション</h2>

            <span class="count">
                登録数：
                <span th:text="${#lists.size(namekos)}">0</span> 匹
            </span>
        </div>

        <div class="search-box">
            <input type="text"
                   id="searchInput"
                   placeholder="🔍 なめこの名前で検索">
        </div>

        <div class="nameko-list"
             th:if="${!#lists.isEmpty(namekos)}">

            <div class="card"
                 th:each="nameko, stat : ${namekos}">

                <div class="card-number">
                    No.
                    <span th:text="${#numbers.formatInteger(stat.index + 1, 3)}">001</span>
                    <span th:text="${nameko.name}">なめこの名前</span>
                </div>

                <div class="card-main">

                    <div class="image-area">

                        <img th:if="${nameko.image != null and !#strings.isEmpty(nameko.image)}"
                             th:src="@{/images/{filename}(filename=${nameko.image})}"
                             th:alt="${nameko.name}"
                             class="nameko-image">


                        <span class="no-image"
                              th:if="${nameko.image == null or #strings.isEmpty(nameko.image)}">
                            🍄<br>画像なし
                        </span>

                    </div>

                    <div class="info-area">


                        <div class="info-box">
                            <span class="info-label">登録番号</span>
                            <span class="info-value"
                                  th:text="'No.' + ${nameko.id}">
                                No.1
                            </span>
                        </div>

                    </div>
                </div>

                <div class="name-area"
                     th:text="${nameko.name}">
                    なめこの名前
                </div>

                <p class="description"
                   th:text="${nameko.description}">
                    なめこの説明が入ります。
                </p>

                <a th:href="@{/namekos/{id}(id=${nameko.id})}"
                   class="button">
                    詳細を見る
                </a>

            </div>

        </div>

        <div class="empty-message"
             th:if="${#lists.isEmpty(namekos)}">
            <h3>まだなめこがいないよ！</h3>
            <p>最初のなめこを図鑑に登録してみよう 🍄</p>
            <a th:href="@{/namekos/new}" class="button">
                なめこを登録する
            </a>
        </div>

        <p id="noResults" class="no-results">
            該当するなめこが見つからなかったよ。
        </p>

    </section>

</main>

<script>
    const searchInput = document.getElementById("searchInput");
    const cards = document.querySelectorAll(".card");
    const noResults = document.getElementById("noResults");

    searchInput.addEventListener("input", function () {
        const keyword = searchInput.value.toLowerCase();
        let visibleCount = 0;

        cards.forEach(function (card) {
            const name = card.querySelector(".name-area").textContent;
            const matches = name.toLowerCase().includes(keyword);

            card.style.display = matches ? "" : "none";

            if (matches) {
                visibleCount++;
            }
        });

        noResults.style.display =
            visibleCount === 0 && cards.length > 0 ? "block" : "none";
    });
</script>

</body>
</html>
